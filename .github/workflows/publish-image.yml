name: Publish Docker image

# Only called by the release workflow. There is deliberately no manual trigger;
# recover a failed publication with "Re-run failed jobs" on the release run.
on:
  workflow_call:
    inputs:
      tag:
        description: Published release tag, for example v0.1.0
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: drawspace-image-release
  cancel-in-progress: false

env:
  REGISTRY: cr.guneet.dev
  IMAGE: cr.guneet.dev/drawspace/drawspace

jobs:
  prepare:
    name: Validate release and resolve immutable source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      short-sha: ${{ steps.version.outputs.short-sha }}
      promote: ${{ steps.version.outputs.promote }}
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Choose a stable release tag in the form vX.Y.Z.'
            exit 1
          fi
          release=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease)
          jq --exit-status --arg tag "$RELEASE_TAG" '.tagName == $tag and .isDraft == false and .isPrerelease == false' <<< "$release"
      - name: Check out the released source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Resolve version and source revision
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version=${RELEASE_TAG#v}
          if [[ "$(jq -r '.version' package.json)" != "$version" ]]; then
            echo '::error::The release tag must match package.json version.'
            exit 1
          fi
          sha=$(git rev-parse HEAD)
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          promote=false
          if [[ "$latest" == "$RELEASE_TAG" ]]; then promote=true; fi
          {
            echo "version=$version"
            echo "sha=$sha"
            echo "short-sha=${sha:0:12}"
            echo "promote=$promote"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Verify the exact release commit
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  # Each platform is pushed by digest only, with SBOM and provenance
  # attestations, then pulled back and smoke-tested on its native runner.
  # No tag points at it until the publish job runs after both tests pass.
  build:
    name: Build, push by digest, and smoke-test ${{ matrix.arch }}
    needs: [prepare, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    environment: release
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: drawspace
          POSTGRES_PASSWORD: smoke-test-password
          POSTGRES_DB: drawspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drawspace -d drawspace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out the verified release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Check registry credentials
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$DOCKER_USERNAME" || -z "$DOCKER_PASSWORD" ]]; then
            echo '::error::Set DOCKER_USERNAME and DOCKER_PASSWORD in the release environment.'
            exit 1
          fi
      - name: Log in to the registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and push the platform image by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.title=Drawspace
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=drawspace-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=drawspace-${{ matrix.arch }}
      - name: Verify the pushed platform image and its attestations
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo '::error::The build did not report an image digest.'
            exit 1
          fi
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" > "$RUNNER_TEMP/index.json"
          image=$(jq --exit-status --raw-output --arg arch "$ARCH" '
            [.manifests[] | select(.platform.os == "linux")] as $images
            | if ($images | length) == 1 and $images[0].platform.architecture == $arch
              then $images[0].digest else error("expected exactly one linux/\($arch) image") end
          ' "$RUNNER_TEMP/index.json")
          attestation=$(jq --exit-status --raw-output --arg image "$image" '
            [.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest"
              and .annotations["vnd.docker.reference.digest"] == $image) | .digest]
            | if length == 1 then .[0] else error("expected one attestation manifest") end
          ' "$RUNNER_TEMP/index.json")
          docker buildx imagetools inspect --raw "$IMAGE@$attestation" \
            | jq --exit-status '
                [.layers[].annotations["in-toto.io/predicate-type"] // empty] as $types
                | ($types | any(startswith("https://slsa.dev/provenance/")))
                  and ($types | any(. == "https://spdx.dev/Document"))
              '
          echo "Verified $IMAGE@$DIGEST: linux/$ARCH image $image with SBOM and provenance attestations"
      - name: Pull the pushed digest and verify container startup, migrations, and health
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          ref="$IMAGE@$DIGEST"
          docker pull --platform "$PLATFORM" "$ref"
          pulled=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$ref")
          if [[ "$pulled" != "$PLATFORM" ]]; then
            echo "::error::Pulled $pulled instead of $PLATFORM."
            exit 1
          fi
          docker run --pull never --detach --name drawspace-smoke --network host \
            --env DATABASE_URL=postgres://drawspace:smoke-test-password@localhost:5432/drawspace \
            --env APP_URL=http://localhost:3000 \
            --env COOKIE_SECURE=false \
            --env ALLOW_REGISTRATION=false \
            "$ref"
          for _ in {1..30}; do
            if curl --fail --silent http://localhost:3000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs drawspace-smoke
          exit 1
      - name: Record the tested digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH"
      - name: Upload the tested digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          if-no-files-found: error
          overwrite: true
      - name: Container diagnostics
        if: failure()
        run: docker logs drawspace-smoke || true
      - name: Remove smoke-test container
        if: always()
        run: docker rm --force drawspace-smoke || true

  publish:
    name: Publish multi-architecture release tags
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.short-sha }}
      PROMOTE: ${{ needs.prepare.outputs.promote }}
    steps:
      - name: Download the tested digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Log in to the registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Tag the tested digests and verify the published index
        env:
          SOURCE_REVISION: ${{ needs.prepare.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          sources=()
          for arch in amd64 arm64; do
            digest=$(< "$RUNNER_TEMP/digests/$arch")
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Missing or invalid tested digest for $arch."
              exit 1
            fi
            sources+=("$IMAGE@$digest")
          done
          major=${VERSION%%.*}
          minor=${VERSION%.*}
          aliases=()
          if [[ "$PROMOTE" == true ]]; then
            aliases+=(latest "v$minor")
            if [[ "$major" != 0 ]]; then aliases+=("v$major"); fi
          fi
          tags=(--tag "$IMAGE:v$VERSION" --tag "$IMAGE:sha-$SOURCE_SHA")
          for alias in "${aliases[@]}"; do tags+=(--tag "$IMAGE:$alias"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:v$VERSION" --raw > "$RUNNER_TEMP/index.json"
          jq --exit-status '
            ([.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort == ["amd64", "arm64"])
            and ([.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length == 2)
          ' "$RUNNER_TEMP/index.json"
          index_digest=$(docker buildx imagetools inspect "$IMAGE:v$VERSION" --format '{{json .Manifest}}' | jq --exit-status --raw-output .digest)
          {
            echo '## Published Drawspace image'
            echo "- Image: \`$IMAGE:v$VERSION@$index_digest\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`, each with SBOM and provenance attestations"
            echo "- Source: \`$SOURCE_REVISION\`"
            echo "- Tags: \`v$VERSION\`, \`sha-$SOURCE_SHA\`"
            if (( ${#aliases[@]} > 0 )); then
              echo "- Moving aliases: $(printf "\`%s\` " "${aliases[@]}")"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
